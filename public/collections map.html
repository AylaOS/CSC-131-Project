<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacramento State waste collection map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
:root{--green:#043927;--green2:#0b5d3b;--gold:#c4b581;--gold-d:#8f6a00;--ink:#14231b;--mute:#5f6e66;--line:#e4e7df;--row:#f7f8f3}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main>header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#06402b;color:#fff;padding:18px 22px;border-radius:8px;border-bottom:4px solid #c9a227;font-size:15px}
header h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em;color:#fff}
header .sub{color:#c9d8cf;font-size:13px}
.header-actions{display:flex;gap:8px}
.header-actions button{font:inherit;font-size:15px;border-radius:6px;padding:6px 10px;cursor:pointer}
#refresh{background:#c9a227;color:#14231b;border:1px solid #c9a227;font-weight:600}
#refresh:hover{filter:brightness(1.08)}
.home-link{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 10px}
.home-link:hover{border-color:#c9a227}
main{max-width:1240px;margin:0 auto;padding:24px 20px 48px;display:grid;grid-template-columns:370px 1fr;gap:24px;align-items:start}
.card{border:1px solid var(--line);border-top:4px solid var(--green2);border-radius:8px;padding:16px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--green)}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input,.tools select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink);background:#fff;min-width:0}
.tools input{flex:1}
#list{max-height:480px;overflow:auto;padding-right:4px}
.loc{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
.loc:hover,.loc.on{background:var(--row);border-left-color:var(--green2)}
.loc b{display:block;color:var(--green);font-weight:600;font-size:15px}
.loc span{display:block;font-size:13px;color:var(--mute)}
.loc .iss{color:var(--ink)}.loc .iss.has{color:var(--gold-d);font-weight:600}
.loc.none b{color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{background:#fff;color:var(--green);font:500 14px inherit;font-family:inherit;padding:8px 13px;border-radius:6px;border:1px solid var(--line);border-bottom:3px solid var(--gold);cursor:pointer}
.btn:hover{background:var(--row)}
:focus-visible{outline:2px solid var(--gold-d);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:0 0 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:2px solid var(--gold)}
#map{height:680px;border:1px solid var(--line);border-bottom:4px solid var(--gold);border-radius:8px;background:#f4f5f0}
#err{display:none;padding:14px 16px;border:1px solid #c0392b;border-radius:8px;margin-bottom:16px}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
@media (max-width:900px){main{grid-template-columns:1fr}#map{height:440px}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Campus waste collection</h1><div class="sub">Sacramento State · last pickup and issues at each location</div></div>
    <div class="header-actions">
      <a class="home-link" href="index.html">← Home</a>
      <button id="refresh">Refresh now</button>
    </div>
  </header>
  <aside class="card" aria-live="polite">
    <h2>Locations <span class="sub" id="placed"></span></h2>
    <div class="legend">
      <span><i style="background:#043927"></i>No issues</span>
      <span><i style="background:#c9a227;border-color:#043927"></i>Has issues</span>
      <span><i style="background:#8a9a90"></i>No pickups found</span>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search locations" aria-label="Search locations">
      <select id="sort" aria-label="Sort locations">
        <option value="name">A–Z</option><option value="issues">Most issues</option><option value="recent">Most recent</option>
      </select>
    </div>
    <div id="list">Loading…</div>
    <div class="btns">
      <button class="btn" id="edit">Adjust pins</button>
      <button class="btn" id="copy" hidden>Copy positions</button>
      <button class="btn" id="relookup">Re-run lookup</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="hint" id="geo"></div>
    <div class="hint" id="basis"></div>
  </aside>
  <section>
    <div id="err" role="alert"></div>
    <div id="map" role="application" aria-label="Map of campus locations with last pickup and issue counts"></div>
  </section>
</main>

<script src="app.js"></script>
<script src="collections-map.js"></script>
</body>
</html>
