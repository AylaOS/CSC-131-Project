<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickup dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f4ef;--panel:#fff;--ink:#14231b;--mute:#5f6e66;--line:#dfe3d8;--accent:#0b5d3b;--gold:#c9a227;--warn:#8f6a00;--row:#f7f8f3;--hdr:#06402b}
@media (prefers-color-scheme:dark){:root{--bg:#0d1612;--panel:#16231c;--ink:#e7eee9;--mute:#94a39a;--line:#2a3a32;--accent:#5fc79a;--gold:#e3c25a;--warn:#e3c25a;--row:#1b2921;--hdr:#06402b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px;background:var(--hdr);color:#fff;padding:18px 22px;border-radius:8px;border-bottom:4px solid var(--gold)}
header .sub{color:#c9d8cf}
#refresh{background:var(--gold);color:#14231b;border-color:var(--gold);font-weight:600}
#refresh:hover{filter:brightness(1.08)}
h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--gold);display:inline-block}
.sub{color:var(--mute);font-size:13px}
button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:16px}
.kpi b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{color:var(--mute);font-size:13px}
.gauge{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.kpi.issue b{color:var(--warn)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.chartbox{position:relative;height:320px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--accent)}
tbody tr:nth-child(even){background:var(--row)}
.tag{color:var(--warn);font-weight:500}
.settings{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--mute);font-size:13px}
.settings label{display:flex;gap:6px;align-items:center}
.msg{padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);margin-bottom:16px}
.msg.err{border-color:#c0392b}.msg code{font-size:13px}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Pickup dashboard</h1><div class="sub" id="sub">Loading…</div></div>
    <button id="refresh">Refresh now</button>
  </header>
  <div id="notice"></div>

  <section class="kpis" aria-live="polite">
    <div class="kpi"><b id="kTotal">–</b><span>Pickups completed</span></div>
    <div class="kpi"><b id="kFull">–</b><span>Average fullness</span><div class="gauge"><i id="gFull" style="width:0"></i></div></div>
    <div class="kpi issue"><b id="kIssues">–</b><span id="kIssuesSub">Pickups with issues</span></div>
  </section>

  <section class="panel">
    <h2>Pickups by date</h2>
    <div class="chartbox"><canvas id="chart" role="img" aria-label="Bar chart of pickups per date"></canvas></div>
  </section>

  <section class="panel">
    <h2>Pickups with issues by date</h2>
    <div class="chartbox"><canvas id="chartIssues" role="img" aria-label="Bar chart of pickups with issues per date"></canvas></div>
    <div class="sub" id="issuesNote" style="margin-top:8px"></div>
  </section>

  <section class="panel">
    <h2>Most recent pickups</h2>
    <div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>

  <section class="panel">
    <h2>Column settings</h2>
    <div class="settings">
      <label>Date <select id="dateCol"></select></label>
      <label>Fullness <select id="fullCol"></select></label>
      <label>Issue <select id="issueCol"></select></label>
      <span id="detected"></span>
    </div>
  </section>
</main>

<script>
// ====== CONFIG ======
const SUPABASE_URL = "https://xwzjokwjhadsliuoufpu.supabase.co";
const SUPABASE_KEY = "sb_publishable_1cdPK9k5b5eTuXDQ27Qg5g_3sit3svN";
const TABLE = "collections";
const REFRESH_SECONDS = 30;     // auto-refresh interval (0 = off)
// ====================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let rows = [], cols = [], chart = null, chartIssues = null;
const saved = (() => { try { return JSON.parse(localStorage.getItem("pickupCols") || "{}"); } catch { return {}; } })();

async function fetchAll() {
  const out = [], size = 1000;
  for (let from = 0; from < 20000; from += size) {
    const { data, error } = await db.from(TABLE).select("*").range(from, from + size - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < size) break;
  }
  return out;
}

async function load() {
  try {
    rows = await fetchAll();
    $("notice").innerHTML = rows.length ? "" :
      '<div class="msg">The table returned no rows. If it has data, add a Row Level Security policy that allows <code>select</code> for the <code>anon</code> role on <code>' + TABLE + '</code>.</div>';
    cols = rows.length ? Object.keys(rows[0]) : cols;
    setupColumns();
    $("sub").textContent = `${rows.length.toLocaleString()} records · updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $("notice").innerHTML = '<div class="msg err">Could not load data: ' + esc(e.message || e) + '</div>';
    $("sub").textContent = "Load failed";
  }
  render();
}

function guess(re) { return cols.find(c => re.test(c)) || ""; }

function setupColumns() {
  const opts = (sel, val, blank) => {
    $(sel).innerHTML = (blank ? '<option value="">(none)</option>' : "") + cols.map(c => `<option>${esc(c)}</option>`).join("");
    $(sel).value = cols.includes(val) ? val : (blank ? "" : cols[0] || "");
  };
  const cur = { date: $("dateCol").value, full: $("fullCol").value, issue: $("issueCol").value };
  const pick = (k, re) => cols.includes(cur[k]) ? cur[k] : cols.includes(saved[k]) ? saved[k] : guess(re);
  opts("dateCol", pick("date", /collected_date|date/i));
  opts("fullCol", pick("full", /full|fill|level/i), true);
  opts("issueCol", pick("issue", /^(has_)?(issue|problem)s?$|issue|problem|flag|damage|contamin|overflow/i), true);
  $("detected").textContent = (!$("fullCol").value || !$("issueCol").value)
    ? "Pick the fullness and issue columns so those numbers can be calculated." : "";
}

const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isNaN(n) ? null : n; };
const isIssue = v => {
  if (v === true) return true;
  if (v == null || v === false) return false;
  if (typeof v === "number") return v > 0;
  const s = String(v).trim().toLowerCase();
  return s !== "" && !["no","none","n/a","na","false","0","ok","null","-","nil"].includes(s);
};

function render() {
  const dc = $("dateCol").value, fc = $("fullCol").value, ic = $("issueCol").value;
  try { localStorage.setItem("pickupCols", JSON.stringify({date:dc, full:fc, issue:ic})); } catch {}

  $("kTotal").textContent = rows.length.toLocaleString();

  // Average fullness (0-1 values are treated as fractions)
  const fv = fc ? rows.map(r => num(r[fc])).filter(n => n !== null) : [];
  if (fv.length) {
    const scale = Math.max(...fv) <= 1 ? 100 : 1;
    const avg = fv.reduce((a, b) => a + b, 0) / fv.length * scale;
    $("kFull").textContent = avg.toFixed(1) + "%";
    $("gFull").style.width = Math.max(0, Math.min(100, avg)) + "%";
  } else { $("kFull").textContent = "–"; $("gFull").style.width = "0"; }

  // Issues
  if (ic) {
    const n = rows.filter(r => isIssue(r[ic])).length;
    $("kIssues").textContent = n.toLocaleString();
    $("kIssuesSub").textContent = rows.length ? `Pickups with issues · ${(n / rows.length * 100).toFixed(1)}% of all` : "Pickups with issues";
  } else { $("kIssues").textContent = "–"; }

  // Pickups by date
  const counts = {};
  rows.forEach(r => { const d = String(r[dc] ?? "").slice(0, 10); if (d) counts[d] = (counts[d] || 0) + 1; });
  const labels = Object.keys(counts).sort();
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim(), gold = css.getPropertyValue("--gold").trim(), mute = css.getPropertyValue("--mute").trim(), line = css.getPropertyValue("--line").trim();
  if (chart) chart.destroy();
  chart = new Chart($("chart"), {
    type: "bar",
    data: { labels, datasets: [{ label: "Pickups", data: labels.map(l => counts[l]), backgroundColor: accent, hoverBackgroundColor: gold, borderRadius: 3, maxBarThickness: 48 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: mute }, grid: { display: false } },
                y: { beginAtZero: true, ticks: { color: mute, precision: 0 }, grid: { color: line } } } }
  });

  // Pickups with issues by date (every date with a pickup is shown, so zero days are visible)
  const issueCounts = {};
  labels.forEach(l => issueCounts[l] = 0);
  if (ic) rows.forEach(r => { const d = String(r[dc] ?? "").slice(0, 10); if (d && isIssue(r[ic])) issueCounts[d]++; });
  const warn = css.getPropertyValue("--warn").trim();
  if (chartIssues) chartIssues.destroy();
  chartIssues = new Chart($("chartIssues"), {
    type: "bar",
    data: { labels, datasets: [{ label: "Pickups with issues", data: labels.map(l => issueCounts[l]), backgroundColor: gold, hoverBackgroundColor: warn, borderRadius: 3, maxBarThickness: 48 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: mute }, grid: { display: false } },
                y: { beginAtZero: true, ticks: { color: mute, precision: 0 }, grid: { color: line } } } }
  });
  $("issuesNote").textContent = !ic ? "Choose an issue column in Column settings to see this chart."
    : Object.values(issueCounts).every(n => n === 0) ? "No pickups with issues found." : "";

  // Recent pickups table
  const show = [dc, "collected_time", "driver_name", "bin_id", fc, ic].filter((c, i, a) => c && cols.includes(c) && a.indexOf(c) === i);
  const recent = rows.slice().sort((a, b) =>
    (String(b[dc] ?? "") + String(b.collected_time ?? "")).localeCompare(String(a[dc] ?? "") + String(a.collected_time ?? ""))).slice(0, 10);
  $("thead").innerHTML = "<tr>" + show.map(c => `<th>${esc(c)}</th>`).join("") + "</tr>";
  $("tbody").innerHTML = recent.map(r => "<tr>" + show.map(c =>
    `<td class="${c === ic && isIssue(r[c]) ? "tag" : ""}">${esc(r[c])}</td>`).join("") + "</tr>").join("");
}

["dateCol", "fullCol", "issueCol"].forEach(id => $(id).addEventListener("change", render));
$("refresh").onclick = load;
if (REFRESH_SECONDS > 0) setInterval(load, REFRESH_SECONDS * 1000);
load();
</script>
</body>
</html>
