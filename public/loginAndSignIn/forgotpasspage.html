<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <script type="module" src="loginandpasschange.js"></script>
    <link rel="stylesheet" href="forgotpasspage.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">


</head>    
<body>
    <div class="sign-in">
        <h1>Create Password</h1>

        <form id="forgotPassForm">
            <label>Email</label>
            <input type="email" id="retEmail" required>

            <button type="submit">Send Reset Link</button>
        </form>  
        <p id = "resetMessage" role="status"></p>
    </div>
</body>
</html>
