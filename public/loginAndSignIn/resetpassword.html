<!DOCTYPE html>
<html>
<!--
Team: "Hello World"
Description: This files displays the forgot password page
-->
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <script type=module src="loginandpasschange.js"></script>
    <link rel="stylesheet" href="forgotpasspage.css">
    <link rel="stylesheet" href="resetpassword.css">
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">


</head>    
<body>
    <div class="sign-in">
        <h1>Create Password</h1>

        <form id="resetPassword">
            <label>New Password</label>
            <input type="password" id="newPassword" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" required>
        
            <ul class="password-requirements">
                <li id="length"> At least 12 characters</li>
                <li id="uppercase"> An uppercase letter</li>
                <li id="lowercase"> A lower case letter</li>
                <li id="number"> A number (0-9)</li>
                <li id="special"> A special character (!@#$%...)</li>
                <li id="password_match">password match</li>
            </ul>

            <button type="submit">Reset Password</button>
        </form>
    </div>
</body>
</html>
