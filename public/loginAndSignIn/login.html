<!DOCTYPE html>
<html>
<!--
Team: "Hello World"
This file displays the login page
-->
<head>

    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script type="module" src="login.js" defer></script>
    <title>Login</title>
    
</head>

<body>
    <div class="login-page">
        <div class="login-section">
            <div class="login-container">
                <h1 id="loginTitle">Driver Sign In</h1>

                <div class="role-tabs" role="group" aria-label="Sign in as">
                    <button type="button" class="role-tab active" data-role="driver" aria-pressed="true">Driver</button>
                    <button type="button" class="role-tab" data-role="supervisor" aria-pressed="false">Supervisor</button>
                </div>

                <form id="loginForm">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" required>

                    <button type="submit">Login</button>
                </form>

                <p id = "loginMessage" role="alert"></p>

                <button type="button" id="forgotPassBtn">Forgot Password</button>
            </div>
        </div>

        <div class="image-section">
            <img src="blossomingLoginPage.jpeg" alt="A blossoming tree at Sac State">
        </div>
    </div>
</body>

</html>
