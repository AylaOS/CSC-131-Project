<!DOCTYPE html>
<html>
<!--
Team: "Hello World"
This file displays the login page
-->
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="loginandpasschange.js" defer></script>
    <title>Login</title>
    
</head>

<body>
    <div class="login-page">
        <div class="login-section">
            <div class="login-container">
                <h1>Login</h1>

                <form id="loginForm">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" required>

                    <button type="submit">Login</button>
                </form>
                <button type="button" id="forgotPassBtn">Forgot Password</button>
            </div>
        </div>

        <div class="image-section">
            <img src="blossomingLoginPage.jpeg" alt="A blossoming tree at Sac State">
        </div>
    </div>
</body>

</html>
